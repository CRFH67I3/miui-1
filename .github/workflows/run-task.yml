name: MIUI Task

# 说明：
# 1. 本 workflow 才会真正执行 miuitask.py（原仓库的 docker-image.yml 只构建镜像）
# 2. 账号密码全部通过 Secret / Variable 注入，运行时生成 config.yaml，明文不进入仓库
# 3. cron 使用 UTC 时间，0 20 * * * = 北京时间次日 04:00
#
# 需要配置的 Repository secrets（Settings > Secrets and variables > Actions）：
#   MIUI_COOKIE         推荐  已登录的社区 Cookie。云端收不到短信，账号一旦被要求短信验证
#                            就只能靠它；配置后不再需要 MIUI_PASSWORD
#   MIUI_UID            必填  小米账户 ID（纯数字，不是用户名/手机号）；用 Cookie 登录时可留空
#   MIUI_PASSWORD       必填  小米账户密码明文，脚本会自动转大写 MD5（有 MIUI_COOKIE 时可省）
#   MIUI_USER_AGENT     可选  登录社区所用 UA，留空用内置默认值
#   MIUI_EXTRA_ACCOUNTS 可选  多账号，JSON 数组（每项可带自己的 cookie）
#
# 需要配置的 Repository variables（同一页面的 Variables 标签）：
#   MIUI_CHECK_IN           可选  true/false  成长值签到（默认 false，有风险）
#   MIUI_CARROT_PULL        可选  true/false  社区拔萝卜（默认 false，有风险）
#   MIUI_BROWSE_SPECIALPAGE 可选  true/false  浏览限时专题页（默认 false）
#   MIUI_LOGGING            可选  true/false  归档日志到 logs/（默认 true）

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miui-task
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 单账号约 5~10 分钟（15 个动作各前置 20~40 秒随机等待）；多账号线性叠加，留足余量
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate config.yaml from secrets
        env:
          MIUI_UID: ${{ secrets.MIUI_UID }}
          MIUI_PASSWORD: ${{ secrets.MIUI_PASSWORD }}
          MIUI_COOKIE: ${{ secrets.MIUI_COOKIE }}
          MIUI_USER_AGENT: ${{ secrets.MIUI_USER_AGENT }}
          MIUI_EXTRA_ACCOUNTS: ${{ secrets.MIUI_EXTRA_ACCOUNTS }}
          MIUI_CHECK_IN: ${{ vars.MIUI_CHECK_IN }}
          MIUI_CARROT_PULL: ${{ vars.MIUI_CARROT_PULL }}
          MIUI_BROWSE_SPECIALPAGE: ${{ vars.MIUI_BROWSE_SPECIALPAGE }}
          MIUI_LOGGING: ${{ vars.MIUI_LOGGING }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import yaml

          # 红米 K70E（2311DRK48C）在 Chrome 下的真实 UA。Chrome 113 起 UA
          # 缩减全面生效，Android 版本冻结为 10、机型替换为字母 K，故不含机型。
          DEFAULT_UA = ('Mozilla/5.0 (Linux; Android 10; K) '
                        'AppleWebKit/537.36 (KHTML, like Gecko) '
                        'Chrome/150.0.0.0 Mobile Safari/537.36')


          def fail(msg):
              print('::error::' + msg)
              sys.exit(1)


          def truthy(name, default=False):
              raw = os.environ.get(name, '')
              if raw is None or str(raw).strip() == '':
                  return default
              return str(raw).strip().lower() in ('1', 'true', 'yes', 'y', 'on')


          def make_account(uid, password, ua, source, cookie=''):
              cookie = str(cookie or '').strip().replace('\r', '').replace('\n', '')
              uid = str(uid or '').strip()
              password = str(password or '').strip()

              if not cookie:
                  if not uid or not password:
                      fail('账号信息不完整（%s）：uid / password 不能为空，'
                           '或改用 MIUI_COOKIE 方式登录' % source)
              if uid and not uid.isdigit():
                  fail('uid 必须是纯数字的小米账户 ID（%s），当前值不是纯数字' % source)

              account = {
                  'uid': uid,
                  'user-agent': (str(ua).strip() if ua else DEFAULT_UA),
                  'carrot-pull': truthy('MIUI_CARROT_PULL'),
                  'check-in': truthy('MIUI_CHECK_IN'),
                  'browse-specialpage': truthy('MIUI_BROWSE_SPECIALPAGE'),
              }
              if cookie:
                  # Cookie 登录：不需要密码，也不会触发短信验证（Actions 里也收不到短信）
                  account['cookie'] = cookie
              else:
                  account['password'] = password
              return account


          uid = os.environ.get('MIUI_UID', '')
          password = os.environ.get('MIUI_PASSWORD', '')
          cookie = os.environ.get('MIUI_COOKIE', '')
          ua = os.environ.get('MIUI_USER_AGENT', '')

          if not cookie.strip() and (not uid.strip() or not password.strip()):
              fail('缺少登录凭据：请配置 MIUI_COOKIE（推荐，免短信验证），'
                   '或同时配置 MIUI_UID 和 MIUI_PASSWORD')

          for secret in (password.strip(), cookie.strip()):
              if secret:
                  print('::add-mask::' + secret)

          accounts = [make_account(uid, password, ua, '主账号', cookie)]

          extra = (os.environ.get('MIUI_EXTRA_ACCOUNTS') or '').strip()
          if extra:
              try:
                  parsed = json.loads(extra)
              except Exception as exc:
                  fail('MIUI_EXTRA_ACCOUNTS 不是合法 JSON：%s' % exc)
              if not isinstance(parsed, list):
                  fail('MIUI_EXTRA_ACCOUNTS 必须是 JSON 数组')
              for idx, item in enumerate(parsed):
                  if not isinstance(item, dict):
                      fail('MIUI_EXTRA_ACCOUNTS 第 %d 项必须是对象' % (idx + 1))
                  accounts.append(make_account(
                      item.get('uid', ''),
                      item.get('password', ''),
                      item.get('user-agent') or ua,
                      '附加账号 #%d' % (idx + 1),
                      item.get('cookie', ''),
                  ))

          config = {
              'accounts': accounts,
              'logging': truthy('MIUI_LOGGING', default=True),
              'version': 'v1.5.2',
          }

          with open('config.yaml', 'w', encoding='utf-8') as fp:
              yaml.safe_dump(config, fp, allow_unicode=True, sort_keys=False)

          print('已生成 config.yaml，账号数：%d' % len(accounts))
          for idx, acc in enumerate(accounts, 1):
              print('  账号 %d  uid=%s  登录方式=%s  check-in=%s  carrot-pull=%s  '
                    'browse-specialpage=%s  ua=%s'
                    % (idx, acc['uid'] or '(来自 Cookie)', 'Cookie' if acc.get('cookie') else '账号密码',
                       acc['check-in'], acc['carrot-pull'],
                       acc['browse-specialpage'], acc['user-agent'][:40]))
          print('logging=%s' % config['logging'])
          PY

      - name: Validate config
        run: |
          python - <<'PY'
          import sys

          from utils.utils import check_config, format_config, get_config

          config = get_config()
          if not check_config(config):
              print('::error::生成的 config.yaml 未通过 check_config 校验')
              sys.exit(1)
          config = format_config(config)
          print('配置校验通过，账号数：%d' % len(config['accounts']))
          PY

      - name: Run MIUI Task
        run: python miuitask.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miui-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
