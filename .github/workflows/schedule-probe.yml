name: Schedule Probe

# 临时诊断用：验证 fork 仓库的 schedule 事件是否能正常触发。
# 每 5 分钟一次，只打印时间，不碰任何账号。验证完请删除本文件。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger info
        run: |
          echo "UTC now : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "event    : ${{ github.event_name }}"
          echo "repo     : ${{ github.repository }}"
          echo "ref      : ${{ github.ref }}"
