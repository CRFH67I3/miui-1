accounts:
  - uid: 100000
    # 小米账户ID 非小米账户用户名
    password: Abcd.1234
    # 小米账户密码或其MD5哈希
    # 若账号登录时总被要求短信验证，可改用下面的 cookie 方式（配了 cookie 就忽略 uid/password）
    # cookie: 'cUserId=xxx; serviceToken=xxx; miui_vip_ph=xxx'
    # 浏览器登录 web.vip.miui.com 后复制整行 Cookie，云端环境唯一稳定的登录方式
    user-agent: 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36'
    # 登录小米社区时所用浏览器的 User-Agent
    # 可在此工具查看：https://tool.chinaz.com/useragent
    # device-id: 选填，16 位十六进制设备号；不填会按账号 ID 自动派生一个稳定值
    carrot-pull: false
    # 小米社区拔萝卜，可能存在封号风险
    check-in: false
    # 小米社区成长值签到，可能存在封号风险
    # 本脚本默认完成登录社区和三次点赞及三次浏览十秒帖子的成长值任务
    browse-specialpage: false
    # 小米社区限时“浏览指定专题页”任务
    # 开启后脚本会先查询任务列表，确认存在未完成的专题页任务才会发送请求；查不到或已完成则自动跳过
# 若有多个小米账户，按照以下模板进行修改，使用时删除前端 #注释
#  - uid: 100001
#    password: abc123
#    user-agent: 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36'
#    carrot-pull: false
#    check-in: false
#    browse-specialpage: false
logging: false
# 归档日志到本地文件
version: v1.5.2
# config 文件版本号，debug用
